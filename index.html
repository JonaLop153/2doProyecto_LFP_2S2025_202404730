<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaBridge - Traductor Java a Python</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f4;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 1rem;
            text-align: center;
        }

        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .java-editor, .python-output {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h3 {
            margin-bottom: 10px;
            color: #2c3e50;
        }

        textarea {
            width: 100%;
            height: 400px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
        }

        .controls {
            text-align: center;
            padding: 20px;
        }

        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #2980b9;
        }

        .reports {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background: #f2f2f2;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }
    </style>
</head>
<body>
    <header>
        <h1>JavaBridge - Traductor Java a Python</h1>
    </header>
    
    <main>
        <div class="editor-container">
            <div class="java-editor">
                <h3>Código Java</h3>
                <textarea id="javaCode" placeholder="// Escribe tu código Java aquí...">public class Test {
    public static void main(String[] args) {
        int x = 5;
    }
}</textarea>
            </div>
            
            <div class="python-output">
                <h3>Python Traducido</h3>
                <textarea id="pythonCode" readonly placeholder="El código Python traducido aparecerá aquí..."></textarea>
            </div>
        </div>
        
        <div class="controls">
            <button id="translateBtn">Generar Traducción</button>
            <button id="tokensBtn">Ver Tokens</button>
            <button id="simulateBtn">Simular Ejecución</button>
        </div>
        
        <div class="reports">
            <div id="tokensReport"></div>
            <div id="errorsReport"></div>
        </div>
    </main>

 <!-- Scripts en el orden CORRECTO -->
<script src="js/parser/ParserCore.js"></script>
<script src="js/parser/DeclarationParser.js"></script>
<script src="js/parser/ExpressionParser.js"></script>
<script src="js/parser/StatementParser.js"></script>
<script src="js/parser/main.js"></script>
<script src="js/lexer.js"></script>
<script src="js/translator.js"></script>
<script src="js/app.js"></script>
</body>
</html>
